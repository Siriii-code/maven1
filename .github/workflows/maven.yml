name:Java CI with Maven
on:
    push:
        branches: [main]
        pull request:
            branches: [main]
    workflow_dispatch:
jobs:
    build: 
        runs on: java jdk-17
        steps:
            -uses: actions/checkout@v3
            -name: Set up JDK 17
            uses: actions/setup-java@v3
            with:
                java-version: '17'
                distribution: 'temurin'

        -name: Complile with Maven
        run: javac hello.java
        -name: Run with Maven
        run: java hello

                


                

